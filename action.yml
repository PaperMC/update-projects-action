name: update-projects
author: Machine-Maker
description: A Github Action to add/move issues and prs around in the new Projects

branding:
  icon: check-circle
  color: blue

inputs:
  github-token:
    description: Access Token with read/write perms for the project
    required: true
  project-url:
    description: URL of the project
    required: true
  column-field:
    description: Name of the field that determines the column
    required: true
  label-to-column-map:
    description: JSON object mapping labels to options in the `column-field`
    required: true
  clear-on-no-match:
    description: Whether or not to clear the `column-field` if no match in `label-to-column-map` is found
    required: true
    default: "true"
  issue-numbers:
    description: >
      Issue/PR numbers of the current repository to process instead of the issue/PR from the
      triggering event (newline- or comma-separated). Allows running from workflow_dispatch,
      schedules or any other event type
    required: false

runs:
  using: node24
  main: dist/index.mjs

